name: Deploy to Cloudways staging

# Merge to main = the human deploy gate. Loop 2 opens a signoff/* branch;
# reviewing and merging its PR is the approval that triggers this deploy.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/staging.yml"
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CLOUDWAYS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.CLOUDWAYS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy dist to staging webroot
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            site/dist/ \
            "${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }}:${{ secrets.CLOUDWAYS_WEBROOT_STAGING }}/"
